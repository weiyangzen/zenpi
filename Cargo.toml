[package]
name = "zenpi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Rust agent with TUI and headless JSONL modes"
license = "MIT"
repository = "https://github.com/weiyangzen/zenpi"
readme = "README.md"
keywords = ["agent", "tui", "headless", "jsonl", "rust"]

[features]
default = []
dev-fixtures = []

[dependencies]
base64 = "0.23"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
httpdate = "1.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
unicode-width = "0.2"
ureq = { version = "3.4", default-features = true, features = ["json"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
