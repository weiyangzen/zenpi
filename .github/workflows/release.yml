name: zenpi release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: tools/release.sh
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          $version = (Select-String '^version = "(.+)"' Cargo.toml).Matches.Groups[1].Value
          $name = "zenpi-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zenpi.exe","README.md","LICENSE" "dist/$name/"
          cargo metadata --locked --format-version 1 | Set-Content "dist/$name/cargo-metadata.json"
          Compress-Archive "dist/$name" "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "dist/$name.zip.sha256"
      - name: Packaged binary smoke
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != "Windows" ]]; then (cd dist && shasum -a 256 -c *.sha256); fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then dist/*/zenpi.exe --help; else dist/*/zenpi --help; fi
      - uses: actions/upload-artifact@v4
        with:
          name: zenpi-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
