<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>zenpi · Stage 1 Gantt</title>
<style>
:root{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#1d2939;background:#f5f7fa;--green:#087f6d;--blue:#3264c8;--amber:#b87313;--border:#dde4eb}*{box-sizing:border-box}body{margin:0}header,main{max-width:1500px;margin:auto;padding:26px 32px}header{padding-bottom:8px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:750}h1{font-size:30px;letter-spacing:-1px;margin:10px 0}p{line-height:1.7;margin:8px 0;color:#637083}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:17px 20px}.card strong{display:block;font-size:30px;margin:5px 0}.card span,.meta{font-size:12px;color:#657487}.card:first-child{border-color:#82bdb0}.progress{height:5px;background:#e5eeeb;margin-top:10px;border-radius:4px}.progress i{display:block;height:100%;background:var(--green);border-radius:4px}.lanes{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.lane{background:#eaf0fb;color:#294e8c;padding:10px 14px;border-radius:10px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 12px;align-items:center}input,select,button{font:inherit;border:1px solid #cad5df;background:white;border-radius:8px;padding:9px 12px;font-size:13px}input{min-width:230px}button{cursor:pointer}button.on{background:#243953;color:white;border-color:#243953}.hint{font-size:12px;margin-bottom:12px}#chart{background:white;border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:68vh}.chart-inner{min-width:1130px}.axis,.row{display:grid;grid-template-columns:410px 96px 1fr;align-items:center;gap:0;border-bottom:1px solid #edf0f4;min-height:42px}.axis{position:sticky;top:0;background:#edf2f7;z-index:2;font-size:11px;color:#526073;height:36px}.axis>div:first-child{padding-left:16px}.row:hover{background:#f5f9ff}.row{cursor:pointer}.row:focus{outline:2px solid var(--blue);outline-offset:-2px}.label{padding:9px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.label b{font-size:11px;display:inline-block;min-width:68px;color:#506174}.state{font:11px ui-monospace,monospace;color:#697889}.state.accept{color:var(--green)}.track{display:grid;grid-template-columns:repeat(var(--cols),1fr);align-self:stretch;align-items:center;background:repeating-linear-gradient(to right,transparent 0,transparent calc(100% / var(--cols) - 1px),#eef1f5 calc(100% / var(--cols) - 1px),#eef1f5 calc(100% / var(--cols)));padding:0 5px}.bar{height:16px;min-width:14px;border-radius:4px;background:#dce3eb;border:1px solid #c3cdd9}.bar.accept{background:#178e7a;border-color:#178e7a}.bar.blocked{background:#d44d45;border-color:#b8312a}.state.blocked{color:#b8312a}.bar.candidate{background:#9973c6;border-color:#7955a5}.state.candidate{color:#7955a5}.bar.worker{background:#91b8ed}.bar.claim{background:#5481d4;border-color:#3264c8}.bar.repair{background:repeating-linear-gradient(135deg,#e4ba73,#e4ba73 5px,#f8e6c8 5px,#f8e6c8 9px);border-color:#c7923e}.group{background:#f7f9fc;padding:9px 16px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border)}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;margin:14px 0;color:#526174}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}.details{position:fixed;right:0;top:0;bottom:0;background:white;width:min(540px,100vw);box-shadow:-15px 0 60px #142a4829;padding:28px;overflow:auto;z-index:4;border-left:1px solid var(--border)}.details h2{font-size:21px;line-height:1.5}.details h3{font-size:13px;margin-top:24px}.details p,.details li{font-size:13px;overflow-wrap:anywhere;line-height:1.8}.details ul{padding-left:18px}.close{float:right}.tag{font-size:12px;background:#edf2f7;border-radius:6px;padding:5px 8px}footer{font-size:11px;color:#7b8794;margin:20px 0;overflow-wrap:anywhere}.empty{padding:35px;color:#697889}@media(max-width:700px){header,main{padding:20px 16px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
</style>
<header><div class="eyebrow">ZENPI / EXECUTION CONTROL</div><h1>Stage 1 · pi-mono 差距执行</h1><p>逐文件、逐目录推进，保留 BentoBox。查看当前认领、局部修复证据与整项验收进度。</p><div class="meta" id="stamp"></div><div class="stats" id="stats"></div><div class="lanes" id="lanes"></div></header>
<main><div class="toolbar"><input id="search" aria-label="搜索任务" placeholder="搜索 ID、功能或文件路径…"><select id="group" aria-label="筛选范围"><option value="">全部范围</option></select><button data-filter="all" class="on">全部</button><button data-filter="open">未完成</button><button data-filter="claim">当前认领</button><button data-filter="candidate">候选待复核</button><button data-filter="blocked">门禁未通过</button><button data-filter="repair">近期修复已验证</button><button data-filter="accepted">主控已验收</button><button id="reset">重置筛选</button></div>
<p class="hint">横轴为<strong>依赖层级</strong>，不代表天数或工期。点击条目查看依赖、路径和证据。认领信息来自当前任务台账；局部修复通过不会自动变成整项验收。</p><div class="legend"><span><i style="background:#178e7a"></i>[x] 主控验收</span><span><i style="background:#91b8ed"></i>[_] worker 自测</span><span><i style="background:#5481d4"></i>当前运行</span><span><i style="background:#9973c6"></i>候选待复核</span><span><i style="background:#e4ba73"></i>近期局部修复已验证</span><span><i style="background:#d44d45"></i>门禁未通过</span><span><i style="background:#dce3eb"></i>[ ] 未完成</span></div><p id="resultCount" class="meta" aria-live="polite"></p><div id="chart"></div><footer id="footer"></footer></main><aside id="details" class="details" hidden></aside>
<script type="application/json" id="data">__GANTT_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent), $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const local=path=>encodeURI(path.startsWith('Docs/')?path.slice(5):'../'+path);
const accepted=data.counts['[x]']||0, self=data.counts['[_]']||0, unfinished=data.rows.length-accepted;
$('stamp').textContent=`蓝图 v${data.version} · 更新 ${data.generated} · 只读进度投影`;
$('stats').innerHTML=`<div class="card"><span>主控整项验收 [x]</span><strong>${accepted} / ${data.rows.length}</strong><span>清单项占比 ${(100*accepted/data.rows.length).toFixed(1)}%，非功能完成率</span><div class="progress"><i style="width:${100*accepted/data.rows.length}%"></i></div></div><div class="card"><span>尚未闭合</span><strong>${unfinished}</strong><span>[ ] ${data.counts['[ ]']||0} 项 · [_] ${self} 项</span></div><div class="card"><span>运行中的认领任务</span><strong>${data.rows.filter(r=>r.owner?.running).length} / 3</strong><span>三个独立任务 · 主控统一整合</span></div><div class="card"><span>近期局部修复证据</span><strong>${data.rows.filter(r=>r.note).length}</strong><span>与整项验收分开计数</span></div>`;
$('lanes').innerHTML=data.rows.filter(r=>r.owner).map(r=>`<div class="lane">${esc(r.owner.name)} · ${r.id} · ${esc(r.title.slice(0,32))} · ${r.owner.running?'运行中':'候选已交付，待主控复核'}</div>`).join('');
const groups=[...new Set(data.rows.map(r=>r.group))];for(const g of groups){const o=document.createElement('option');o.value=o.textContent=g;$('group').append(o)}
let filter='all', lastFocus=null;
function show(row){lastFocus=document.activeElement;const d=$('details');d.hidden=false;d.innerHTML=`<button class="close" aria-label="关闭详情">关闭 ×</button><span class="tag">${row.id} · ${esc(row.state)} · ${esc(row.layer)}</span><h2>${esc(row.title)}</h2><p>${esc(row.group)} · 依赖层级 ${row.depth}</p><h3>当前进度</h3><p>${row.state==='[x]'?'主控已接受此清单项。':row.state==='[_]'?'worker 自测完成，等待主控整项验收。':'整项尚未完成验收。'}</p>${row.owner?`<p>${esc(row.owner.name)} · ${row.owner.running?'运行中':'候选已交付，待主控复核'}。</p>${row.owner.note?`<p>${esc(row.owner.note)}</p>`:''}`:''}${row.blocker?`<h3>未通过的门禁</h3><p>${esc(row.blocker)}</p><p><a href="${local(row.blockerEvidence)}">查看原始失败记录 ↗</a></p>`:''}${row.note?`<p>${esc(row.note)}。这是一处已验证修复，不能替代整项全部验收。</p>`:''}<h3>直接依赖</h3><p>${esc(row.depends.join(' · ')||'无')}</p><h3>尚未通过整项验收的依赖</h3><p>${esc(row.unmet.join(' · ')||'无')}</p><h3>Owned paths</h3><ul>${row.owned.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${row.evidence?`<p><a href="${local(row.evidence)}">查看主控证据记录 ↗</a></p>`:''}<p><a href="stage_1_v3_pi_mono_blueprint.md">查看权威蓝图 ↗</a> · 第 ${row.line} 行</p>`;d.querySelector('button').onclick=close;d.querySelector('button').focus()}
function close(){$('details').hidden=true;if(lastFocus)lastFocus.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function render(){const query=$('search').value.toLowerCase(),group=$('group').value;const rows=data.rows.filter(r=>(!group||r.group===group)&&(!query||[r.id,r.title,...r.owned,r.note,r.blocker||''].join(' ').toLowerCase().includes(query))&&(filter==='all'||filter==='open'&&r.state!=='[x]'||filter==='claim'&&r.owner||filter==='candidate'&&r.owner&&!r.owner.running||filter==='blocked'&&r.blocker||filter==='repair'&&r.note||filter==='accepted'&&r.state==='[x]'));$('resultCount').textContent=`显示 ${rows.length} / ${data.rows.length} 项`;
let markup=`<div class="chart-inner" style="--cols:${data.maxDepth+1}"><div class="axis"><div>条目 / 独立验收单元</div><div>状态</div><div class="track">${Array.from({length:data.maxDepth+1},(_,i)=>`<span>${i}</span>`).join('')}</div></div>`;
for(const g of groups){const selected=rows.filter(r=>r.group===g);if(!selected.length)continue;markup+=`<div class="group">${esc(g)} · ${selected.length} 项</div>`;for(const row of selected){const kind=row.state==='[x]'?'accept':row.state==='[_]'?'worker':row.owner?.running?'claim':row.owner?'candidate':row.blocker?'blocked':row.note?'repair':'';markup+=`<div class="row" tabindex="0" role="button" data-id="${row.id}" aria-label="${esc(row.id+' '+row.title)}"><div class="label" title="${esc(row.title)}"><b>${row.id}</b>${esc(row.title)}</div><div class="state ${kind}">${esc(row.state)} ${row.owner?esc(row.owner.running?row.owner.name:'待复核'):row.blocker?'门禁未过':row.note?'局部验证':''}</div><div class="track"><div class="bar ${kind}" style="grid-column:${row.depth+1}" title="依赖层级 ${row.depth}"></div></div></div>`}}
$('chart').innerHTML=markup+(rows.length?'':'<div class="empty">没有匹配项</div>')+'</div>';for(const el of document.querySelectorAll('.row')){const open=()=>show(data.rows.find(r=>r.id===el.dataset.id));el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}}}
for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{filter=button.dataset.filter;for(const b of document.querySelectorAll('[data-filter]'))b.classList.toggle('on',b===button);render()};$('search').oninput=render;$('group').onchange=render;$('reset').onclick=()=>{$('search').value='';$('group').value='';document.querySelector('[data-filter="all"]').click()};
$('footer').innerHTML=`<a href="stage_1_v3_pi_mono_gantt.md">Markdown 版本</a> · <a href="stage_1_v3_pi_mono_blueprint.md">权威蓝图</a><br>快照：${esc(data.snapshot)}<br>刷新：在项目根目录运行 python3 tools/generate_stage1_gantt.py。此页面是生成时快照；每次主控整合后重新生成。`;
render();
</script></html>
