[package]
name = "zenpi-render-tail-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "zenpi"
path = "lib.rs"

[[test]]
name = "render_markdown"
path = "../context-render_markdown.rs"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"

[patch.crates-io]
crossterm = { path = "../../../vendor/crossterm" }
